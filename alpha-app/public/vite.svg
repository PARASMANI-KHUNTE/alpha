<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="alphaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="alphaStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="alphaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="32" height="32" rx="8" fill="url(#alphaBg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#44403c" stroke-width="1" stroke-opacity="0.6" />

  <!-- Soft glow -->
  <circle cx="16" cy="16" r="10" fill="url(#alphaGlow)" />

  <!-- Modern Alpha 'α' intertwined with Contact node motif -->
  <path
    d="M21.5 10.5 C19.5 10.5 17 12.8 15.5 15 C13.8 12.5 11 10.5 8.5 10.5 C5.2 10.5 3.5 13.2 3.5 16.5 C3.5 20.2 5.8 22.5 9 22.5 C12 22.5 14.8 20 16.5 16.8 L21.8 23"
    fill="none"
    stroke="url(#alphaStroke)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M21.5 10.5 L15.8 19.5"
    fill="none"
    stroke="url(#alphaStroke)"
    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- Contact node / person focal point -->
  <circle cx="9.2" cy="16.5" r="1.8" fill="#ffffff" />
  <circle cx="21.5" cy="10.5" r="1.4" fill="#38bdf8" />
</svg>